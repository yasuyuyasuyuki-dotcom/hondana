<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>hondana - デジタル読書記録＆本棚</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/@phosphor-icons/web"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Serif+JP:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --wood-light: #e5e5e5;
      --wood-dark: #d4d4d4;
    }
    body {
      font-family: 'Inter', sans-serif;
      background-color: #f9fafb;
      -webkit-tap-highlight-color: transparent;
    }
    .font-serif-jp { font-family: 'Noto Serif JP', serif; }
    
    /* 隠しスクロールバー */
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

    /* 本棚の棚板デザイン */
    .shelf-row {
      position: relative;
      margin-bottom: 2rem;
      min-height: 180px;
      display: flex;
      align-items: flex-end;
      padding: 0 1rem 0.5rem 1rem;
      border-bottom: 12px solid var(--wood-light);
      box-shadow: inset 0 -4px 6px -4px rgba(0,0,0,0.1), 0 4px 6px -1px rgba(0,0,0,0.05);
    }
    .shelf-row::after {
      content: '';
      position: absolute;
      bottom: -12px;
      left: 0;
      right: 0;
      height: 12px;
      background: var(--wood-dark);
      z-index: -1;
    }

    /* 書籍アイテム (表紙ビュー用) */
    .book-item-cover {
      perspective: 1000px;
      margin-right: -10px;
      transition: transform 0.3s ease, margin 0.3s ease;
      cursor: pointer;
    }
    .book-item-cover:hover {
      transform: translateY(-10px) translateZ(20px);
      margin-right: 5px;
      margin-left: 5px;
      z-index: 10;
    }
    .book-shadow {
      box-shadow: 
        -2px 0 5px rgba(0,0,0,0.1),
        5px 5px 15px rgba(0,0,0,0.15),
        inset 2px 0 3px rgba(255,255,255,0.3);
    }
    .book-spine-hint {
      position: absolute;
      left: 0;
      top: 0;
      bottom: 0;
      width: 4px;
      background: linear-gradient(to right, rgba(255,255,255,0.6), rgba(255,255,255,0));
      border-radius: 4px 0 0 4px;
      z-index: 2;
    }

    /* Spine View (背表紙ビュー - 白地に黒字) */
    .book-item-spine {
      position: relative;
      cursor: pointer;
      margin-right: 2px;
      background-color: #ffffff;
      border: 1px solid #e5e7eb;
      border-left: 2px solid #f3f4f6;
      border-right: 2px solid #e5e7eb;
      box-shadow: 
        inset 3px 0 5px rgba(255,255,255,0.8),
        inset -2px 0 3px rgba(0,0,0,0.02),
        2px 2px 5px rgba(0,0,0,0.08);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 12px;
      transition: transform 0.2s ease, filter 0.2s ease;
      border-radius: 3px;
    }
    
    .book-item-spine:hover {
      transform: translateY(-5px);
      z-index: 20;
    }

    .book-item-spine::before {
      content: '';
      position: absolute;
      top: 0;
      left: 4px;
      right: 4px;
      height: 2px;
      background: rgba(0,0,0,0.05);
      border-radius: 50%;
    }
    .book-item-spine::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 4px;
      right: 4px;
      height: 2px;
      background: rgba(0,0,0,0.05);
      border-radius: 50%;
    }

    .spine-title {
      writing-mode: vertical-rl;
      text-orientation: upright;
      font-family: 'Noto Serif JP', serif;
      font-size: 12px;
      color: #111827;
      letter-spacing: 2px;
      font-weight: 500;
      max-height: 85%;
      overflow: hidden;
      margin-top: 4px;
      text-shadow: 0.5px 0.5px 0px rgba(255,255,255,0.8);
    }

    /* 背表紙ホバー時のポップアップカバー */
    .spine-hover-cover {
      position: absolute;
      bottom: 110%;
      left: 50%;
      transform: translateX(-50%) translateY(10px);
      width: 100px;
      height: 140px;
      opacity: 0;
      visibility: hidden;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border-radius: 4px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2), 0 4px 6px -2px rgba(0, 0, 0, 0.1);
      z-index: 30;
      pointer-events: none;
    }
    .book-item-spine:hover .spine-hover-cover {
      opacity: 1;
      visibility: visible;
      transform: translateX(-50%) translateY(0);
    }

    /* Modal Animation */
    .modal-enter { opacity: 0; transform: scale(0.95) translateY(10px); }
    .modal-enter-active { opacity: 1; transform: scale(1) translateY(0); transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .modal-exit { opacity: 1; transform: scale(1) translateY(0); }
    .modal-exit-active { opacity: 0; transform: scale(0.95) translateY(10px); transition: all 0.2s ease-in; }

    /* Toast */
    .toast-enter { transform: translateY(100%); opacity: 0; }
    .toast-enter-active { transform: translateY(0); opacity: 1; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .toast-exit { transform: translateY(0); opacity: 1; }
    .toast-exit-active { transform: translateY(100%); opacity: 0; transition: all 0.2s ease-in; }
    
    #map-container {
      touch-action: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col text-gray-800">

  <!-- Header -->
  <header class="bg-white/80 backdrop-blur-md border-b border-gray-100 sticky top-0 z-30">
    <div class="max-w-5xl mx-auto px-4 h-16 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <h1 class="text-xl font-bold tracking-tight text-gray-900">hondana</h1>
      </div>
      <div class="flex items-center gap-3">
        <button id="btn-share" class="w-9 h-9 flex items-center justify-center rounded-full bg-gray-50 text-gray-600 hover:bg-gray-100 hover:text-gray-900 transition" title="本棚を共有">
          <i class="ph ph-share-network text-lg"></i>
        </button>
        <button id="btn-add-book" class="flex items-center gap-2 bg-gray-900 hover:bg-gray-800 text-white px-4 py-2 rounded-full text-sm font-medium transition shadow-sm">
          <i class="ph ph-plus-bold"></i> <span class="hidden sm:inline">本を追加</span>
        </button>
      </div>
    </div>
  </header>

  <main class="flex-1 max-w-5xl mx-auto w-full px-4 py-6 flex flex-col">
    
    <!-- Navigation Tabs -->
    <div class="flex gap-6 mb-6 border-b border-gray-100">
      <button id="tab-bookshelf" class="pb-3 text-sm font-medium text-gray-900 border-b-2 border-gray-900 transition -mb-[1px]">Bookshelf</button>
      <button id="tab-mapping" class="pb-3 text-sm font-medium text-gray-400 hover:text-gray-900 border-b-2 border-transparent transition -mb-[1px]">Knowledge Map</button>
    </div>

    <!-- Bookshelf View -->
    <div id="view-bookshelf" class="flex-1 flex flex-col">
      <!-- Filters & View Toggle -->
      <div class="flex flex-col gap-3 mb-6 border-b border-gray-100 pb-3">
        <div class="flex flex-wrap items-center justify-between gap-4">
          <div class="flex gap-4">
            <button class="filter-btn active text-sm font-medium text-gray-900 border-b-2 border-gray-900 pb-2 -mb-[13px]" data-filter="all">すべて <span id="count-all" class="ml-1 text-xs text-gray-500">0</span></button>
            <button class="filter-btn text-sm font-medium text-gray-400 hover:text-gray-900 border-b-2 border-transparent pb-2 -mb-[13px] transition" data-filter="read">読了 <span id="count-read" class="ml-1 text-xs text-gray-400">0</span></button>
            <button class="filter-btn text-sm font-medium text-gray-400 hover:text-gray-900 border-b-2 border-transparent pb-2 -mb-[13px] transition" data-filter="reading">読書中 <span id="count-reading" class="ml-1 text-xs text-gray-400">0</span></button>
            <button class="filter-btn text-sm font-medium text-gray-400 hover:text-gray-900 border-b-2 border-transparent pb-2 -mb-[13px] transition" data-filter="wish">読みたい <span id="count-wish" class="ml-1 text-xs text-gray-400">0</span></button>
          </div>
          
          <div class="flex items-center gap-2">
            <!-- View Toggle -->
            <div class="flex bg-gray-100 rounded-lg p-1 mr-2">
              <button id="btn-view-spine" class="w-8 h-8 flex items-center justify-center rounded-md bg-white shadow-sm text-gray-900 transition" title="背表紙ビュー">
                <i class="ph ph-books text-lg"></i>
              </button>
              <button id="btn-view-cover" class="w-8 h-8 flex items-center justify-center rounded-md text-gray-400 hover:text-gray-900 transition" title="表紙ビュー">
                <i class="ph ph-squares-four text-lg"></i>
              </button>
            </div>
            
            <button id="btn-ai-discover" class="flex items-center gap-1.5 text-xs font-medium text-indigo-600 bg-indigo-50 hover:bg-indigo-100 px-3 py-1.5 rounded-full transition">
              <i class="ph-fill ph-sparkle"></i> AI Discover
            </button>
          </div>
        </div>

        <!-- Genre Tabs Bar with Edit Button -->
        <div class="flex items-center gap-2 overflow-x-auto no-scrollbar pt-2 pb-1" id="genre-tabs-container">
          <!-- Dynamically populated genre tabs -->
        </div>
      </div>

      <!-- Bookshelf Container -->
      <div id="bookshelf-container" class="flex-1 pb-20 flex flex-col"></div>

      <!-- Empty State -->
      <div id="empty-state" class="hidden flex-col items-center justify-center py-20 text-center">
        <i class="ph ph-books text-4xl text-gray-300 mb-4"></i>
        <h2 class="text-lg font-medium text-gray-900 mb-2">本棚は空です</h2>
        <p class="text-sm text-gray-500 mb-6 max-w-md font-serif-jp">右上から本を検索して<br>あなたの本棚を作り始めましょう。</p>
      </div>
    </div>

    <!-- Mapping / Knowledge Map View -->
    <div id="view-mapping" class="hidden flex-1 flex-col h-[calc(100vh-200px)] min-h-[500px]">
      <div class="flex justify-between items-center mb-4">
        <p class="text-sm text-gray-500">縦軸にジャンル、横軸に時間をマッピングし、本同士のつながりを可視化します。</p>
        <button id="btn-connect-mode" class="text-sm font-medium px-4 py-2 rounded-full bg-gray-100 text-gray-600 hover:bg-gray-200 transition flex items-center gap-2">
          <i class="ph ph-git-merge text-lg"></i> <span>Connect Mode: OFF</span>
        </button>
      </div>
      <div id="map-container" class="relative flex-1 bg-white border border-gray-100 rounded-2xl overflow-auto shadow-inner cursor-grab touch-pan-x touch-pan-y" style="background-image: radial-gradient(#e5e7eb 1px, transparent 1px); background-size: 20px 20px;">
        <div id="map-content" class="relative min-w-[1000px] min-h-[600px] p-8">
          <div id="map-grid" class="absolute inset-0 pointer-events-none"></div>
          <svg id="map-svg" class="absolute inset-0 w-full h-full pointer-events-none"></svg>
          <div id="map-nodes" class="absolute inset-0 w-full h-full pointer-events-none"></div>
        </div>
      </div>
    </div>
  </main>

  <!-- Search Modal -->
  <div id="modal-search" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex-col items-center pt-20 px-4">
    <div class="bg-white w-full max-w-lg rounded-2xl shadow-2xl overflow-hidden flex flex-col max-h-[80vh] modal-enter" id="modal-search-content">
      <form id="search-form" class="p-4 border-b border-gray-100 flex items-center gap-3" onsubmit="return false;">
        <i class="ph ph-magnifying-glass text-gray-400 text-xl"></i>
        <!-- 検索キーボード対策として autofocus は付けない -->
        <input type="text" id="search-input" placeholder="タイトル、著者名で検索..." class="flex-1 text-base outline-none bg-transparent placeholder-gray-300 text-gray-900 font-medium">
        <button type="submit" id="btn-execute-search" class="bg-gray-900 text-white px-4 py-2 rounded-lg text-sm font-medium">検索</button>
        <button type="button" id="btn-close-search" class="w-8 h-8 flex items-center justify-center rounded-full bg-gray-50 text-gray-400 hover:bg-gray-200 transition">
          <i class="ph ph-x text-lg"></i>
        </button>
      </form>
      
      <div id="search-results" class="flex-1 overflow-y-auto p-2 no-scrollbar">
        <div id="search-loading" class="hidden py-10 flex-col items-center justify-center text-gray-400">
          <i class="ph ph-spinner animate-spin text-2xl mb-2"></i>
          <span class="text-sm">書籍を検索中...</span>
        </div>
        <div id="search-idle" class="py-12 flex flex-col items-center justify-center text-center">
          <i class="ph ph-books text-4xl text-gray-200 mb-3"></i>
          <p class="text-sm text-gray-400 font-serif-jp">キーワードを入力して書籍を検索</p>
          <button id="btn-manual-add" class="mt-6 text-sm text-indigo-600 underline hover:text-indigo-800">
            検索で見つからない本を手動で追加する
          </button>
        </div>
      </div>
    </div>
  </div>

  <!-- Book Detail / Edit Modal -->
  <div id="modal-detail" class="fixed inset-0 bg-black/40 backdrop-blur-sm z-50 hidden flex-col items-center pt-10 pb-10 px-4 overflow-y-auto">
    <div class="bg-white w-full max-w-2xl rounded-2xl shadow-2xl flex flex-col min-h-[500px] modal-enter relative my-auto" id="modal-detail-content">
      <button id="btn-close-detail" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-gray-100/80 text-gray-500 hover:bg-gray-200 transition z-10">
        <i class="ph ph-x text-lg"></i>
      </button>

      <div class="flex flex-col md:flex-row h-full">
        <!-- Left: Cover & Basic Info -->
        <div class="w-full md:w-2/5 bg-gray-50 p-6 flex flex-col items-center border-r border-gray-100 rounded-l-2xl">
          <div class="w-32 md:w-40 aspect-[2/3] bg-white rounded-md shadow-md mb-4 relative group cursor-pointer" id="detail-cover-wrapper">
            <img id="detail-cover" src="" alt="Cover" class="w-full h-full object-cover rounded-md">
            <div class="absolute inset-0 bg-black/50 rounded-md opacity-0 group-hover:opacity-100 flex items-center justify-center transition-opacity">
              <i class="ph ph-pencil-simple text-white text-2xl"></i>
            </div>
          </div>
          
          <div id="cover-edit-container" class="w-full mb-4 hidden">
            <label class="block text-xs font-medium text-gray-500 mb-1">表紙画像URL</label>
            <input type="text" id="detail-cover-url" class="w-full bg-white border border-gray-200 rounded-lg p-2 text-xs focus:ring-2 focus:ring-gray-200 outline-none text-gray-700" placeholder="https://...">
          </div>

          <div class="w-full mb-4">
            <label class="block text-xs font-medium text-gray-400 mb-1">タイトル</label>
            <input type="text" id="detail-title-input" class="w-full bg-white border border-gray-200 rounded-lg p-2 text-sm font-bold text-gray-900 font-serif-jp focus:ring-2 focus:ring-gray-200 outline-none">
          </div>

          <p id="detail-author" class="text-sm text-gray-500 text-center mb-6"></p>

          <div class="w-full flex flex-col gap-3">
            <div>
              <label class="block text-xs font-medium text-gray-400 mb-1">Status</label>
              <select id="detail-status" class="w-full bg-white border border-gray-200 rounded-lg p-2 text-sm focus:ring-2 focus:ring-gray-200 outline-none text-gray-700 font-medium">
                <option value="read">読了</option>
                <option value="reading">読書中</option>
                <option value="wish">読みたい</option>
              </select>
            </div>
            <div>
              <label class="block text-xs font-medium text-gray-400 mb-1">Rating</label>
              <div class="flex items-center gap-1 text-2xl text-gray-300" id="detail-rating-stars"></div>
              <input type="hidden" id="detail-rating" value="0">
            </div>
          </div>
        </div>

        <!-- Right: Memo & Details -->
        <div class="w-full md:w-3/5 p-6 flex flex-col">
          <div class="flex-1 flex flex-col space-y-4">
            <div class="grid grid-cols-2 gap-4">
              <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">Start Date</label>
                <input type="date" id="detail-start-date" class="w-full bg-gray-50 border-none rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-gray-200 outline-none text-gray-700">
              </div>
              <div>
                <label class="block text-xs font-medium text-gray-400 mb-1">End Date</label>
                <input type="date" id="detail-end-date" class="w-full bg-gray-50 border-none rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-gray-200 outline-none text-gray-700">
              </div>
            </div>

            <div>
              <label class="block text-xs font-medium text-gray-400 mb-1">Genre / Category</label>
              <input type="text" id="detail-genre" placeholder="例: 小説, ビジネス, 哲学..." class="w-full bg-gray-50 border-none rounded-lg p-2.5 text-sm focus:ring-2 focus:ring-gray-200 outline-none text-gray-700">
            </div>

            <div class="flex-1 flex flex-col">
              <div class="flex items-center justify-between mb-1">
                <label class="block text-xs font-medium text-gray-400">Review & Memo</label>
                <button id="btn-ai-review" class="text-xs text-indigo-500 hover:text-indigo-700 flex items-center gap-1 font-medium bg-indigo-50 px-2 py-0.5 rounded">
                  <i class="ph-fill ph-sparkle"></i> AI文章アシスト
                </button>
              </div>
              <textarea id="detail-memo" class="flex-1 w-full bg-gray-50 border-none rounded-lg p-3 text-sm focus:ring-2 focus:ring-gray-200 outline-none text-gray-800 resize-none font-serif-jp min-h-[150px]" placeholder="感想や心に残ったフレーズを記録..."></textarea>
            </div>
          </div>

          <div class="mt-6 flex gap-3 pt-4 border-t border-gray-100" id="detail-actions">
            <button id="btn-delete-book" class="px-4 py-2 rounded-lg text-sm font-medium text-red-500 hover:bg-red-50 transition">削除</button>
            <div class="flex-1"></div>
            <button id="btn-save-book" class="px-6 py-2 rounded-lg bg-gray-900 hover:bg-gray-800 text-white text-sm font-medium transition shadow-sm">保存</button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div id="toast-container" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2"></div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, doc, setDoc, getDoc, collection, addDoc, getDocs, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    // --- Helpers ---
    const generateId = () => Math.random().toString(36).substr(2, 9);
    const escapeHtml = (unsafe) => {
      if(!unsafe) return '';
      return unsafe.toString()
           .replace(/&/g, "&amp;")
           .replace(/</g, "&lt;")
           .replace(/>/g, "&gt;")
           .replace(/"/g, "&quot;")
           .replace(/'/g, "&#039;");
    };

    function showToast(message, type = 'success') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      const icon = type === 'success' ? '<i class="ph-fill ph-check-circle text-green-500 text-lg"></i>' : 
                   (type === 'ai' ? '<i class="ph-fill ph-sparkle text-indigo-500 text-lg"></i>' : '<i class="ph-fill ph-warning-circle text-red-500 text-lg"></i>');
      
      toast.className = `flex items-center gap-2 bg-white px-4 py-3 rounded-xl shadow-lg border border-gray-100 text-sm font-medium text-gray-800 toast-enter`;
      toast.innerHTML = `${icon} <span>${escapeHtml(message)}</span>`;
      container.appendChild(toast);

      requestAnimationFrame(() => {
        toast.classList.remove('toast-enter');
        toast.classList.add('toast-enter-active');
      });

      setTimeout(() => {
        toast.classList.remove('toast-enter-active');
        toast.classList.add('toast-exit');
        requestAnimationFrame(() => toast.classList.add('toast-exit-active'));
        setTimeout(() => toast.remove(), 200);
      }, 3000);
    }

    // --- State ---
    const state = {
      books: [],
      links: [],
      currentFilter: 'all',
      selectedBookId: null,
      isPortfolioMode: false,
      viewMode: 'spine',
      activeTab: 'bookshelf',
      isConnectMode: false,
      connectSourceId: null
    };

    const GEMINI_API_KEY = ""; // 自動提供される前提

    // --- Firebase Init ---
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
    const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
      // Mock for local testing without environment
      apiKey: "mock", authDomain: "mock", projectId: "mock"
    };

    let app, db, auth, currentUser;

    async function initApp() {
      try {
        app = initializeApp(firebaseConfig);
        db = getFirestore(app);
        auth = getAuth(app);

        if (typeof __initial_auth_token !== 'undefined') {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }
        
        currentUser = auth.currentUser;
        await loadData();
        renderBookshelf();
      } catch (e) {
        console.error("Firebase init error:", e);
        // Fallback for local view
        await loadData();
        renderBookshelf();
      }
    }

    // --- Data Load & Sync ---
    async function loadData() {
      const urlParams = new URLSearchParams(window.location.search);
      const portfolioId = urlParams.get('portfolio');
      
      if (portfolioId) {
        // Portfolio Mode: Read from shared public snapshot
        state.isPortfolioMode = true;
        document.getElementById('btn-add-book').classList.add('hidden');
        document.getElementById('btn-share').classList.add('hidden');
        
        try {
          if(!db) throw new Error("DB not init");
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'portfolios', portfolioId);
          const docSnap = await getDoc(docRef);
          if (docSnap.exists()) {
            const data = docSnap.data();
            state.books = data.books || [];
            state.links = data.links || [];
          } else {
            showToast('ポートフォリオが見つかりません', 'error');
          }
        } catch (e) {
          console.error(e);

    function calculateSpineMetrics(book) {
      let width = 22;
      let height = 145;

      if (book.pages && book.pages > 0) {
        width = Math.max(12, Math.min(60, book.pages / 12));
        if (book.pages > 500) height = 180;
        else if (book.pages > 300) height = 165;
        else if (book.pages > 200) height = 150;
        else height = 135;
      } else {
        const hash = Math.abs(book.id.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0));
        width = 18 + (hash % 30);
        const variations = [135, 145, 155, 165, 175];
        height = variations[hash % variations.length];
      }
      return { width, height };
    }

    function renderBookshelf() {
      const container = document.getElementById('bookshelf-container');
      const emptyState = document.getElementById('empty-state');
      container.innerHTML = '';
      updateCounts();

      let filtered = state.books;
      if (['all', 'read', 'reading', 'wish'].includes(state.currentFilter)) {
        if (state.currentFilter !== 'all') {
          filtered = state.books.filter(b => b.status === state.currentFilter);
        }
      } else {
        filtered = state.books.filter(b => (b.safeGenre || b.genre || '未分類') === state.currentFilter);
      }
      
      filtered.sort((a, b) => b.addedAt - a.addedAt);

      if (filtered.length === 0) {
        emptyState.classList.remove('hidden');
        emptyState.classList.add('flex');
        return;
      } else {
        emptyState.classList.add('hidden');
        emptyState.classList.remove('flex');
      }

      const containerWidth = container.clientWidth || 800;
      let racks = [];
      let currentRack = [];
      let currentRackWidth = 0;

      if (state.viewMode === 'cover') {
        const itemsPerRow = window.innerWidth < 640 ? 4 : (window.innerWidth < 1024 ? 6 : 8);
        for (let i = 0; i < filtered.length; i++) {
          currentRack.push(filtered[i]);
          if (currentRack.length === itemsPerRow || i === filtered.length - 1) {
            racks.push(currentRack);
            currentRack = [];
          }
        }
      } else {
        const maxRackWidth = containerWidth - 40;
        for (let i = 0; i < filtered.length; i++) {
          const book = filtered[i];
          const metrics = calculateSpineMetrics(book);
          const w = metrics.width + 2;
          
          if (currentRackWidth + w > maxRackWidth && currentRack.length > 0) {
            racks.push(currentRack);
            currentRack = [book];
            currentRackWidth = w;
          } else {
            currentRack.push(book);
            currentRackWidth += w;
          }
          if (i === filtered.length - 1) {
            racks.push(currentRack);
          }
        }
      }

      racks.forEach(rackBooks => {
        const row = document.createElement('div');
        row.className = 'shelf-row';
        
        if (state.viewMode === 'spine') {
          row.style.justifyContent = 'flex-start';
          row.style.gap = '2px';
        }

        rackBooks.forEach(book => {
          const fallbackImg = `https://placehold.co/200x300/f3f4f6/9ca3af?text=${encodeURIComponent(book.title.substring(0,2))}`;
          const imgUrl = book.coverUrl ? escapeHtml(book.coverUrl) : fallbackImg;
          
          if (state.viewMode === 'cover') {
            const item = document.createElement('div');
            item.className = 'book-item-cover w-[22%] sm:w-[14%] lg:w-[11%] aspect-[2/3] relative rounded-sm bg-gray-100 flex-shrink-0';
            item.onclick = () => openBookDetail(book.id);
            item.innerHTML = `
              <div class="absolute inset-0 rounded-sm overflow-hidden book-shadow">
                <img src="${imgUrl}" class="w-full h-full object-cover" onerror="this.src='${fallbackImg}'" alt="${escapeHtml(book.title)}">
                <div class="book-spine-hint"></div>
              </div>
            `;
            row.appendChild(item);
          } else {
            const metrics = calculateSpineMetrics(book);
            const item = document.createElement('div');
            item.className = 'book-item-spine';
            item.style.width = `${metrics.width}px`;
            item.style.height = `${metrics.height}px`;
            item.onclick = () => openBookDetail(book.id);
            
            item.innerHTML = `
              <div class="spine-title">${escapeHtml(book.title)}</div>
              <div class="spine-hover-cover">
                <img src="${imgUrl}" class="w-full h-full object-cover rounded-md" onerror="this.src='${fallbackImg}'">
              </div>
            `;
            row.appendChild(item);
          }
        });
        container.appendChild(row);
      });
      
      const emptyRow = document.createElement('div');
      emptyRow.className = 'shelf-row opacity-50';
      container.appendChild(emptyRow);
    }

    // --- STREAMING_CHUNK:Search Logic... ---
    async function executeSearch(query) {
      let results = [];
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 10000); // 10秒タイムアウト

      try {
        const bdRes = await fetch(`https://api.openbd.jp/v1/get?isbn=${encodeURIComponent(query.replace(/-/g, ''))}`, { signal: controller.signal });
        const bdData = await bdRes.json();
        if (bdData && bdData[0]) {
          const item = bdData[0];
          results.push({
            title: item.summary.title || 'タイトルなし',
            author: item.summary.author || '著者不明',
            coverUrl: item.summary.cover || '',
            pages: 0
          });
          return results; 
        }
      } catch(e) {}

      try {
        const gbRes = await fetch(`https://www.googleapis.com/books/v1/volumes?q=${encodeURIComponent(query)}&maxResults=5&printType=books&langRestrict=ja`, { signal: controller.signal });
        const gbData = await gbRes.json();
        if (gbData.items && gbData.items.length > 0) {
          return gbData.items.map(item => ({
            title: item.volumeInfo.title || 'タイトルなし',
            author: item.volumeInfo.authors ? item.volumeInfo.authors.join(', ') : '著者不明',
            coverUrl: item.volumeInfo.imageLinks ? item.volumeInfo.imageLinks.thumbnail.replace('http:', 'https:') : '',
            pages: item.volumeInfo.pageCount || 0
          }));
        }
      } catch(e) {}

      try {
        const olRes = await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(query)}&limit=5`, { signal: controller.signal });
        const olData = await olRes.json();
        if (olData.docs && olData.docs.length > 0) {
          return olData.docs.map(doc => ({
            title: doc.title || 'タイトルなし',
            author: doc.author_name ? doc.author_name.join(', ') : '著者不明',
            coverUrl: doc.cover_i ? `https://covers.openlibrary.org/b/id/${doc.cover_i}-M.jpg` : '',
            pages: doc.number_of_pages_median || 0
          }));
        }
      } catch(e) {}

      clearTimeout(timeoutId);
      
      // Fallback AI
      if (results.length === 0 && GEMINI_API_KEY) {
        try {
          const payload = {
            contents: [{ role: 'user', parts: [{ text: `書籍検索：「${query}」。日本の書籍データを優先して最大5件JSON配列で返せ。キーは title, author, coverUrl, pages(数値)。` }] }],
            tools: [{ "google_search": {} }],
            generationConfig: { responseMimeType: "application/json" }
          };
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`;
          const res = await fetch(apiUrl, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(payload) });
          const json = await res.json();
          const text = json.candidates?.[0]?.content?.parts?.[0]?.text;
          if (text) {
            const parsed = JSON.parse(text);
            if (Array.isArray(parsed)) {
              results = parsed.map(b => ({
                title: b.title || query,
                author: b.author || '著者不明',
                coverUrl: b.coverUrl || '',
                pages: b.pages || 200
              }));
            }
          }
        } catch(e) { console.error("AI Fallback failed", e); }
      }
      return results;
    }

    async function callGeminiAPI(prompt) {
      if (!GEMINI_API_KEY) {
        return new Promise(resolve => setTimeout(() => resolve("AIによるレビューのサンプル文章です。本の内容を深く味わう素晴らしい一冊でした。"), 1000));
      }
      try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
        });
        const data = await response.json();
        return data.candidates[0].content.parts[0].text;
      } catch (e) {
        return "エラーが発生しました。";
      }
    }

            id: generateId(), title: rec.title, author: rec.author, coverUrl: '',
            status: 'wish', rating: 0, memo: 'AI Discover おすすめ', startDate: '', endDate: '',
            addedAt: Date.now(), genre: '名作'
          };
          state.books.push(newBook);
          await saveBookToCloud(newBook); // Sync
        }
        renderBookshelf();
        showToast('AIのおすすめを「読みたい」に追加しました！', 'success');
      }, 1000);
    });

    // --- STREAMING_CHUNK:Event Listeners & Portfolio Share... ---
    document.getElementById('btn-view-spine').addEventListener('click', (e) => {
      state.viewMode = 'spine';
      e.currentTarget.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
      e.currentTarget.classList.remove('text-gray-400', 'hover:text-gray-900');
      const coverBtn = document.getElementById('btn-view-cover');
      coverBtn.classList.remove('bg-white', 'shadow-sm', 'text-gray-900');
      coverBtn.classList.add('text-gray-400', 'hover:text-gray-900');
      renderBookshelf();
    });
    
    document.getElementById('btn-view-cover').addEventListener('click', (e) => {
      state.viewMode = 'cover';
      e.currentTarget.classList.add('bg-white', 'shadow-sm', 'text-gray-900');
      e.currentTarget.classList.remove('text-gray-400', 'hover:text-gray-900');
      const spineBtn = document.getElementById('btn-view-spine');
      spineBtn.classList.remove('bg-white', 'shadow-sm', 'text-gray-900');
      spineBtn.classList.add('text-gray-400', 'hover:text-gray-900');
      renderBookshelf();
    });

    document.querySelectorAll('.filter-btn').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('.filter-btn').forEach(b => {
          b.classList.remove('active', 'text-gray-900', 'border-gray-900');
          b.classList.add('text-gray-400', 'border-transparent');
        });
        e.currentTarget.classList.add('active', 'text-gray-900', 'border-gray-900');
        e.currentTarget.classList.remove('text-gray-400', 'border-transparent');
        state.currentFilter = e.currentTarget.getAttribute('data-filter');
        renderBookshelf();
        renderGenreTabs();
      });
    });

    function closeModal(id) {
      const modal = document.getElementById(id);
      const content = document.getElementById(`${id}-content`);
      content.classList.remove('modal-enter-active');
      content.classList.add('modal-exit');
      requestAnimationFrame(() => content.classList.add('modal-exit-active'));
      
      setTimeout(() => {
        modal.classList.add('hidden');
        modal.classList.remove('flex');
        content.classList.remove('modal-exit', 'modal-exit-active');
        content.classList.add('modal-enter');
      }, 200);
    }

    document.getElementById('btn-add-book').addEventListener('click', () => {
      const modal = document.getElementById('modal-search');
      const content = document.getElementById('modal-search-content');
      modal.classList.remove('hidden');
      modal.classList.add('flex');
      content.classList.remove('modal-exit', 'modal-exit-active', 'modal-enter');
      requestAnimationFrame(() => content.classList.add('modal-enter-active'));
      
      document.getElementById('search-input').value = '';
      document.getElementById('search-idle').classList.remove('hidden');
      document.getElementById('search-loading').classList.add('hidden');
      document.getElementById('search-loading').classList.remove('flex');
      
      Array.from(document.getElementById('search-results').children).forEach(child => {
        if (child.id !== 'search-loading' && child.id !== 'search-idle') child.remove();
      });
    });

    document.getElementById('btn-close-search').addEventListener('click', () => closeModal('modal-search'));
    document.getElementById('btn-close-detail').addEventListener('click', () => closeModal('modal-detail'));

    document.getElementById('btn-save-book').addEventListener('click', async () => {
      const book = state.books.find(b => b.id === state.selectedBookId);
      if (book) {
        const newTitle = document.getElementById('detail-title-input').value.trim();
        if(newTitle) book.title = newTitle;
        book.status = document.getElementById('detail-status').value;
        book.rating = parseInt(document.getElementById('detail-rating').value);
        book.memo = document.getElementById('detail-memo').value.trim();
        book.coverUrl = document.getElementById('detail-cover-url').value.trim();
        book.startDate = document.getElementById('detail-start-date').value;
        book.endDate = document.getElementById('detail-end-date').value;
        book.genre = document.getElementById('detail-genre').value.trim() || '未分類';
        
        await saveBookToCloud(book); // Sync

        renderBookshelf();
        if(state.activeTab === 'mapping') renderMapping();
        closeModal('modal-detail');
        showToast('変更を保存しました');
      }
    });

    document.getElementById('btn-delete-book').addEventListener('click', async () => {
      state.books = state.books.filter(b => b.id !== state.selectedBookId);
      
      // Cleanup links associated with this book
      const removedLinks = state.links.filter(l => l.source === state.selectedBookId || l.target === state.selectedBookId);
      state.links = state.links.filter(l => l.source !== state.selectedBookId && l.target !== state.selectedBookId);
      
      await deleteBookFromCloud(state.selectedBookId);
      for(const l of removedLinks) await deleteLinkFromCloud(l);

      renderBookshelf();
      if(state.activeTab === 'mapping') renderMapping();
      closeModal('modal-detail');
      showToast('本を削除しました');
    });

    // Cloud Portfolio Sharing
    document.getElementById('btn-share').addEventListener('click', async () => {
      const shareBtn = document.getElementById('btn-share');
      shareBtn.innerHTML = '<i class="ph ph-spinner animate-spin text-lg"></i>';
      shareBtn.disabled = true;

      try {
        if(!db) throw new Error("Database not initialized");

        // 1. スナップショットデータを作成
        const portfolioData = {
          books: state.books,
          links: state.links,
          createdAt: Date.now(),
          ownerId: currentUser ? currentUser.uid : 'anonymous'
        };

        // 2. クラウド（Firestore）の public/portfolios コレクションに保存
        const portfoliosRef = collection(db, 'artifacts', appId, 'public', 'data', 'portfolios');
        const docRef = await addDoc(portfoliosRef, portfolioData);
        
        // 3. 短い共有用URLの生成
        const baseUrl = window.location.href.split('#')[0].split('?')[0];
        const shareUrl = `${baseUrl}?portfolio=${docRef.id}`;

        const dummy = document.createElement('input');
        document.body.appendChild(dummy);
        dummy.value = shareUrl;
        dummy.select();
        document.execCommand('copy');
        document.body.removeChild(dummy);
        
        showToast('ポートフォリオの共有リンク(短縮URL)をコピーしました！');
      } catch (error) {
        console.error('Share error:', error);
        showToast('共有リンクの生成に失敗しました', 'error');
      } finally {
        shareBtn.innerHTML = '<i class="ph ph-share-network text-lg"></i>';
        shareBtn.disabled = false;
      }
    });

    // --- STREAMING_CHUNK:Knowledge Map Logic... ---
    document.getElementById('tab-bookshelf').addEventListener('click', (e) => {
      state.activeTab = 'bookshelf';
      e.target.classList.add('text-gray-900', 'border-gray-900');
      e.target.classList.remove('text-gray-400', 'border-transparent');
      const mapTab = document.getElementById('tab-mapping');
      mapTab.classList.remove('text-gray-900', 'border-gray-900');
      mapTab.classList.add('text-gray-400', 'border-transparent');
      
      document.getElementById('view-bookshelf').classList.remove('hidden');
      document.getElementById('view-bookshelf').classList.add('flex');
      document.getElementById('view-mapping').classList.add('hidden');
      document.getElementById('view-mapping').classList.remove('flex');
    });

    document.getElementById('tab-mapping').addEventListener('click', (e) => {
      state.activeTab = 'mapping';
      e.target.classList.add('text-gray-900', 'border-gray-900');
      e.target.classList.remove('text-gray-400', 'border-transparent');
      const bsTab = document.getElementById('tab-bookshelf');
      bsTab.classList.remove('text-gray-900', 'border-gray-900');
      bsTab.classList.add('text-gray-400', 'border-transparent');
      
      document.getElementById('view-bookshelf').classList.add('hidden');
      document.getElementById('view-bookshelf').classList.remove('flex');
      document.getElementById('view-mapping').classList.remove('hidden');
      document.getElementById('view-mapping').classList.remove('flex');
      setTimeout(() => renderMapping(), 50);
    });

    document.getElementById('btn-connect-mode').addEventListener('click', (e) => {
      if(state.isPortfolioMode) {
        showToast('ポートフォリオモードでは編集できません', 'error');
        return;
      }
      state.isConnectMode = !state.isConnectMode;
      state.connectSourceId = null;
      const btn = e.currentTarget;
      if(state.isConnectMode) {
        btn.classList.add('bg-indigo-100', 'text-indigo-700');
        btn.classList.remove('bg-gray-100', 'text-gray-600');
        btn.innerHTML = `<i class="ph ph-git-merge text-indigo-500 text-lg"></i> <span class="font-bold">Connect Mode: ON</span>`;
      } else {
        btn.classList.remove('bg-indigo-100', 'text-indigo-700');
        btn.classList.add('bg-gray-100', 'text-gray-600');
        btn.innerHTML = `<i class="ph ph-git-merge text-lg"></i> <span>Connect Mode: OFF</span>`;
      }
      renderMapping();
    });

    const mapContainer = document.getElementById('map-container');
    let isDraggingMap = false;
    let startX, startY, scrollLeft, scrollTop;

    mapContainer.addEventListener('mousedown', (e) => {
      if(e.target.closest('.map-node') || e.target.tagName === 'path') return;
      isDraggingMap = true;
      mapContainer.classList.add('cursor-grabbing');
      startX = e.pageX - mapContainer.offsetLeft;
      startY = e.pageY - mapContainer.offsetTop;
      scrollLeft = mapContainer.scrollLeft;
      scrollTop = mapContainer.scrollTop;
    });
    mapContainer.addEventListener('mouseleave', () => { isDraggingMap = false; mapContainer.classList.remove('cursor-grabbing'); });
    mapContainer.addEventListener('mouseup', () => { isDraggingMap = false; mapContainer.classList.remove('cursor-grabbing'); });
    mapContainer.addEventListener('mousemove', (e) => {
      if(!isDraggingMap) return;
      e.preventDefault();
      const x = e.pageX - mapContainer.offsetLeft;
      const y = e.pageY - mapContainer.offsetTop;
      mapContainer.scrollLeft = scrollLeft - (x - startX) * 1.5;
      mapContainer.scrollTop = scrollTop - (y - startY) * 1.5;
    });

    function getBookTime(book) {
      let t;
      if (book.endDate) t = new Date(book.endDate).getTime();
      if (!t || isNaN(t)) {
        if (book.startDate) t = new Date(book.startDate).getTime();
      }
      if (!t || isNaN(t)) t = book.addedAt;
      if (!t || isNaN(t)) t = Date.now();
      return t;
    }

    function renderMapping() {
      const content = document.getElementById('map-content');
      const svg = document.getElementById('map-svg');
      const nodesContainer = document.getElementById('map-nodes');
      const gridContainer = document.getElementById('map-grid');

      svg.innerHTML = '';
      nodesContainer.innerHTML = '';
      gridContainer.innerHTML = '';

      if (state.books.length === 0) return;

      const processedBooks = state.books.map(b => ({
        ...b,
        safeGenre: b.genre && b.genre.trim() !== '' ? b.genre.trim() : '未分類',
        time: getBookTime(b)
      }));

      const genres = [...new Set(processedBooks.map(b => b.safeGenre))].sort();
      const times = processedBooks.map(b => b.time);
      const minTime = Math.min(...times);
      const maxTime = Math.max(...times);
      const timeRange = Math.max(maxTime - minTime, 1000 * 60 * 60 * 24 * 30);
      
      const paddingX = 150;
      const paddingY = 80;
      const laneHeight = 180;
      const containerWidth = mapContainer.clientWidth || 1000;
      const mapWidth = Math.max(1000, containerWidth * 1.5);
      const mapHeight = Math.max(600, genres.length * laneHeight + paddingY * 2);
      
      content.style.width = `${mapWidth}px`;
      content.style.height = `${mapHeight}px`;

      genres.forEach((g, i) => {
        const y = paddingY + i * laneHeight;
        gridContainer.innerHTML += `
          <div class="absolute left-0 right-0 border-t-2 border-gray-100 border-dashed" style="top: ${y}px"></div>
          <div class="absolute left-6 text-xs font-bold text-gray-400 bg-white/80 px-2 py-1 rounded" style="top: ${y - 12}px">${escapeHtml(g)}</div>
        `;
      });

      const nodeCoords = {};
      processedBooks.forEach((book) => {
        const genreIdx = genres.indexOf(book.safeGenre);
        const ratio = (book.time - minTime) / timeRange;
        const x = paddingX + ratio * (mapWidth - paddingX * 2);
        const hash = Math.abs(book.id.split('').reduce((a,b)=>{a=((a<<5)-a)+b.charCodeAt(0);return a&a},0));
        const y = paddingY + genreIdx * laneHeight + ((hash % 80) - 40);
        
        nodeCoords[book.id] = { x, y };

        const isSource = state.isConnectMode && state.connectSourceId === book.id;
        const ringClass = isSource ? 'ring-4 ring-indigo-400 border-indigo-500 bg-indigo-50' : 'border-white ring-2 ring-transparent hover:shadow-lg bg-white';
        const fallbackImg = `https://placehold.co/100x150/f3f4f6/9ca3af?text=${encodeURIComponent(book.title.substring(0,2))}`;

        const nodeHtml = `
          <div class="map-node absolute transform -translate-x-1/2 -translate-y-1/2 pointer-events-auto cursor-pointer group flex flex-col items-center gap-1.5 hover:z-50 z-10 transition-all duration-200 ${isSource ? 'scale-110 z-50' : 'hover:scale-110'}" 
               style="left: ${x}px; top: ${y}px;" data-id="${book.id}">
            <div class="w-16 h-16 rounded-full overflow-hidden shadow border-2 ${ringClass} transition-all">
              <img src="${escapeHtml(book.coverUrl || fallbackImg)}" class="w-full h-full object-cover" onerror="this.src='${fallbackImg}'">
            </div>
            <span class="text-[11px] font-medium bg-white/95 backdrop-blur shadow-sm px-2.5 py-1 rounded-full text-gray-700 truncate max-w-[120px] border border-gray-100">${escapeHtml(book.title)}</span>
          </div>
        `;
        nodesContainer.insertAdjacentHTML('beforeend', nodeHtml);
      });

      const svgNs = "http://www.w3.org/2000/svg";
      state.links.forEach(link => {
        const s = nodeCoords[link.source];
        const t = nodeCoords[link.target];
        if(s && t) {
          const path = document.createElementNS(svgNs, "path");
          const cx = (s.x + t.x) / 2;
          path.setAttribute("d", `M ${s.x} ${s.y} C ${cx} ${s.y}, ${cx} ${t.y}, ${t.x} ${t.y}`);
          path.setAttribute("fill", "transparent");
          path.setAttribute("stroke", "#cbd5e1");
          path.setAttribute("stroke-width", "2.5");
          path.setAttribute("stroke-dasharray", "5,5");
          path.setAttribute("class", "cursor-pointer pointer-events-auto transition-colors hover:stroke-red-400");
          
          path.addEventListener('click', async (e) => {
            if(state.isPortfolioMode || !state.isConnectMode) return;
            state.links = state.links.filter(l => !(l.source === link.source && l.target === link.target));
            await deleteLinkFromCloud(link); // Sync
            renderMapping();
            showToast('つながりを削除しました');
          });
          svg.appendChild(path);
        }
      });

      document.querySelectorAll('.map-node').forEach(node => {
        node.addEventListener('click', async (e) => {
          e.stopPropagation();
          const id = node.getAttribute('data-id');
          if (state.isConnectMode) {
            if (!state.connectSourceId) {
              state.connectSourceId = id;
              renderMapping(); 
            } else {
              if (state.connectSourceId !== id) {
                const exists = state.links.some(l => 
                  (l.source === state.connectSourceId && l.target === id) ||
                  (l.target === state.connectSourceId && l.source === id)
                );
                if(!exists) {
                  const newLink = { source: state.connectSourceId, target: id };
                  state.links.push(newLink);
                  await saveLinkToCloud(newLink); // Sync
                  showToast('本同士をリンクしました');
                }
              }
              state.connectSourceId = null;
              renderMapping();
            }
          } else {
            openBookDetail(id);
          }
        });
      });
    }

    window.addEventListener('resize', () => {
      if (state.activeTab === 'bookshelf') renderBookshelf();
      else renderMapping();
    });
    
    // Boot
    initApp();
  </script>
</body>
</html>
